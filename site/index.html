<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zephyr: daily reading, with the wind</title>
<link rel="stylesheet" href="app.css">
<script>
  // Apply the pinned theme before first paint so the page never flashes the wrong one.
  (function () {
    var t = localStorage.getItem('zephyr.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<header class="topbar">
  <span class="brand">ZEPHYR</span>
  <span class="day" id="dayLabel"></span>
  <button class="theme" id="themeBtn" aria-label="Switch between light and dark">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"></circle>
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
    </svg>
  </button>
</header>

<main>
  <!-- Today card -->
  <section class="screen active" id="screen-today">
    <p class="sample-note" id="sampleNote" hidden>Sample article. Real ones go in <code>content/articles/YYYY-MM-DD.json</code></p>
    <h1 id="cardTitle">…</h1>
    <p class="meta" id="cardMeta"></p>
    <div class="preview" id="previewWords"></div>
    <button class="primary" id="startBtn">Start reading</button>
    <p class="hint">The text scrolls by itself. Keep up, because you cannot scroll back.</p>
  </section>

  <!-- Reader -->
  <section class="screen" id="screen-reader">
    <div class="reader" id="reader" tabindex="0" aria-label="Reading area. Tap to pause or resume.">
      <div class="track" id="track"></div>
      <div class="band" aria-hidden="true"></div>
      <div class="fade top" aria-hidden="true"></div>
      <div class="fade bottom" aria-hidden="true"></div>
      <div class="countdown" id="countdown" hidden></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="controls">
      <button id="slower" aria-label="Slower">−</button>
      <button class="play" id="playBtn" aria-label="Play or pause">⏸</button>
      <button id="faster" aria-label="Faster">＋</button>
      <div class="wpm"><b id="wpmVal"></b>wpm</div>
    </div>
  </section>

  <!-- Done (replaced by quiz + results in WP3) -->
  <section class="screen" id="screen-done">
    <h1>Done</h1>
    <p class="meta big" id="doneStats"></p>
    <p class="attribution" id="attribution"></p>
    <p class="hint">The quiz and the streak arrive with WP3 and WP4. See PLAN.md.</p>
    <button class="primary" id="againBtn">Read again</button>
  </section>

  <!-- Empty state -->
  <section class="screen" id="screen-empty">
    <h1>No article today</h1>
    <p class="hint">The wind is resting. Come back tomorrow.</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
